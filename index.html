<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guardia Civil · English Trainer</title>
<style>
:root{--bg:#f2f4f3;--card:#fff;--ink:#173124;--muted:#657168;--green:#214f33;--green2:#2e6844;--green3:#e7efe9;--gold:#d4c64f;--ok:#287548;--bad:#b3261e;--line:#d8ded9;--soft:#f7f9f7;--shadow:0 2px 10px rgba(25,45,32,.08)}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}
button{border:0;border-radius:9px;padding:10px 14px;background:var(--green);color:#fff;font-weight:700;cursor:pointer}
button:hover{background:var(--green2)}
button.secondary{background:#edf2ee;color:var(--green);border:1px solid #cbd6cf}
button.danger{background:#9e2a24}
button.link{background:none;color:var(--green);padding:5px 0;text-decoration:underline}
.wrap{min-height:100vh}
header{background:var(--green);color:#fff;border-bottom:4px solid var(--gold);padding:18px 16px}
.brand{display:flex;align-items:center;gap:12px;max-width:760px;margin:auto}
.shield{width:43px;height:49px;border:2px solid rgba(255,255,255,.9);border-radius:13px 13px 15px 15px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;letter-spacing:-1px;position:relative}
.shield:before{content:"";position:absolute;top:-8px;left:10px;width:19px;height:8px;border-radius:8px 8px 2px 2px;background:var(--gold)}
.brand-title{font-size:18px;font-weight:850;line-height:1.1}
.sub{font-size:12px;opacity:.82;margin-top:3px}
main{max-width:760px;margin:0 auto;padding:18px 13px 42px}
.card,.result,.qcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px;box-shadow:var(--shadow)}
.card+.card{margin-top:14px}
.lead{font-size:11px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;color:var(--green)}
h2{font-size:19px;margin:4px 0 8px}
h3{margin:0 0 10px}
p{line-height:1.45}
.small{font-size:12px;color:var(--muted)}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.row>button{flex:0 0 auto}
.notice{background:var(--green3);border-left:4px solid var(--green);padding:10px 12px;border-radius:8px;margin-top:10px;font-size:13px}
.topbar{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);backdrop-filter:blur(9px);border-bottom:1px solid var(--line);padding:9px 13px}
.topin{max-width:760px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.timer{font-size:19px;font-weight:900;letter-spacing:.03em;min-width:68px;text-align:center}
.timer.warn{color:#8a6400}.timer.danger{color:var(--bad)}
.progress{height:7px;background:#dfe7e1;border-radius:999px;overflow:hidden;margin-bottom:12px}
.progress i{display:block;height:100%;background:var(--green);border-radius:999px}
.qmeta{font-size:12px;color:var(--muted);margin-bottom:10px}
.question{font-size:17px;font-weight:750;line-height:1.4;margin-bottom:14px}
.option{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);padding:11px 12px;border-radius:9px;margin:8px 0;background:#fff;cursor:pointer}
.option:hover{background:var(--soft)}
.option input{margin-top:3px;accent-color:var(--green)}
.blank-note{text-align:center;font-weight:800;font-size:13px;margin:12px 0;color:var(--green)}
.nav-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:13px}
.nav-grid button{padding:7px 2px;background:#fff;color:var(--green);border:1px solid var(--line);font-size:12px}
.nav-grid button.answered{background:#dcecdf;border-color:#9fc0a8}
.nav-grid button.current{box-shadow:inset 0 0 0 2px var(--gold);font-weight:900}
.nav-grid button:hover{background:#edf4ee}
.question-actions{display:flex;justify-content:space-between;gap:8px;margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.stat{border:1px solid var(--line);border-radius:9px;padding:10px;text-align:center;background:var(--soft)}
.stat b{display:block;font-size:20px}.stat span{display:block;font-size:11px;color:var(--muted)}
.apt{color:var(--ok)}.noapt{color:var(--bad)}
.result h2{text-align:center;font-size:28px;margin:5px 0}
.result .stats{margin-top:16px}
.review{margin-top:14px}
.review-title{text-align:center;margin:18px 0 10px}
.review-sub{text-align:center;color:var(--muted);font-size:13px;margin-top:-5px}
.item{border:1px solid var(--line);border-radius:10px;padding:12px;margin:9px 0;background:#fff}
.item.bad{border-left:5px solid var(--bad)}
.item.ok{border-left:5px solid var(--ok)}
.item.blank{border-left:5px solid #b6beb8}
.item .correct{color:var(--ok);font-weight:800}
.item .wrong{color:var(--bad);font-weight:800}
.history-row{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);padding:11px;border-radius:9px;margin:8px 0;background:#fff;cursor:pointer}
.history-row:hover{background:var(--soft)}
.history-score{font-weight:900}
.history-score.pass{color:var(--ok)}.history-score.fail{color:var(--bad)}
select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);margin-bottom:9px}
.center{text-align:center}
@media(max-width:560px){
 main{padding:13px 10px 32px}.brand-title{font-size:17px}.question{font-size:16px}
 .stats{grid-template-columns:repeat(2,1fr)}
 .nav-grid{grid-template-columns:repeat(5,1fr)}
 .topin{align-items:center}.topbar button{padding:9px 11px}
}
</style>
</head>

respuesta_correcta":"a"},{"numero":9,"pregunta":"Martha ___ the violin when she was younger.","opciones":{"a":"used to played","b":"was used play","c":"used to play","d":"usually play"},"respuesta_correcta":"c"},{"numero":10,"pregunta":"We haven’t got _____ rice, but we’ve got _____ bananas.","opciones":{"a":"some / any","b":"any / some","c":"anything / something","d":"a / a"},"respuesta_correcta":"b"},{"numero":11,"pregunta":"The shoe shop is ____ the third floor, ____ the phone shop.","opciones":{"a":"on / opposite of","b":"on / next to","c":"in / in front","d":"at / near of"},"respuesta_correcta":"b"},{"numero":12,"pregunta":"The film “Avatar”, ____ was directed by James Cameron, won 3 Oscars in 2010.","opciones":{"a":"whose","b":"who","c":"which","d":"whom"},"respuesta_correcta":"c"},{"numero":13,"pregunta":"Choose the correct option:","opciones":{"a":"Look! How a beautiful birds!","b":"Look! What beautifuls bird!","c":"Look! What bird a beautiful!","d":"Look! What a beautiful bird!"},"respuesta_correcta":"d"},{"numero":14,"pregunta":"_____ your bike when you were six?","opciones":{"a":"Can you ridden","b":"Could you riding","c":"Could you ride","d":"Can you riding"},"respuesta_correcta":"c"},{"numero":15,"pregunta":"Please, don’t speak so____. I don’t speak Spanish very _____.","opciones":{"a":"faster / better","b":"fastly / god","c":"fastly / good","d":"fast / well"},"respuesta_correcta":"d"},{"numero":16,"pregunta":"Travelling by train is _____ travelling by plane.","opciones":{"a":"cheap than","b":"cheapest than","c":"more cheaper that","d":"cheaper than"},"respuesta_correcta":"d"},{"numero":17,"pregunta":"Rewrite this statement in reported speech: Mike said: “I lost my glasses yesterday”.","opciones":{"a":"Mike said that he has lost my glasses the day after.","b":"Mike said that he had lost his glasses the day before.","c":"Mike said that he have lost his glasses the day before.","d":"Mike said that he had losed his glasses the day after."},"respuesta_correcta":"b"},{"numero":18,"pregunta":"I can’t concentrate. The neighbours are making _____ noise.","opciones":{"a":"a lot","b":"too","c":"too many","d":"too much"},"respuesta_correcta":"d"},{"numero":19,"pregunta":"Choose the correct option:","opciones":{"a":"What do want she for dinner?","b":"What want she for dinner?","c":"What does she want for dinner?","d":"What do she wants for dinner?"},"respuesta_correcta":"c"},{"numero":20,"pregunta":"She _____ when the doorbell _____.","opciones":{"a":"was studying / ringed","b":"was studying / rang","c":"were studying / rung","d":"were studying / rang"},"respuesta_correcta":"b"}],"reserva":[{"numero":21,"pregunta":"Choose the correct option:","opciones":{"a":"Have you made a decision yet?","b":"Have you make a decision already?","c":"Have you already make a decision?","d":"Have made you a decision yet?"},"respuesta_correcta":null}]},{"id":15,"nombre":"2017 - página 33","paginas_preguntas":[33],"pagina_respuestas":null,"preguntas":[{"numero":1,"pregunta":"Choose the correct option:","opciones":{"a":"Where does work his cousins?","b":"Where works his cousins?","c":"Where work do his cousins?","d":"Where do his cousins work?"},"respuesta_correcta":"d"},{"numero":2,"pregunta":"She ______ him a present, but she ______ “Happy Birthday”.","opciones":{"a":"gave / didn’t say","b":"given / didn’t said","c":"give / didn’t say","d":"gave / didn’t said"},"respuesta_correcta":"a"},{"numero":3,"pregunta":"My Porsche is ______ your Ferrari.","opciones":{"a":"more faster that","b":"more fast that","c":"faster than","d":"fastest than"},"respuesta_correcta":"c"},{"numero":4,"pregunta":"Choose the correct sentence:","opciones":{"a":"They have been marry for 12 years.","b":"They have been married for 12 years.","c":"They have been married since 12 years ago.","d":"They have being married since 12 years."},"respuesta_correcta":"b"},{"numero":5,"pregunta":"_____ when they _____?","opciones":{"a":"Was it raining / arrived","b":"Was raining / arriving","c":"Did it raining / arrived","d":"Was it raining / be arrived"},"respuesta_correcta":"a"},{"numero":6,"pregunta":"He was talking _____ in front of the mirror.","opciones":{"a":"to himself","b":"to themselves","c":"to herself","d":"to himself"},"respuesta_correcta":"a"},{"numero":7,"pregunta":"Choose the correct option:","opciones":{"a":"How sad story!","b":"What a sad story!","c":"What story a sad!","d":"What sad story!"},"respuesta_correcta":"b"},{"numero":8,"pregunta":"If I _____ in the USA, I _____ Las Vegas.","opciones":{"a":"will live / would visit","b":"would live / would visits","c":"lived / would visit","d":"lived / would visited"},"respuesta_correcta":"c"},{"numero":9,"pregunta":"Carlos _____ when he was four, but he _____.","opciones":{"a":"can read / couldn’t written","b":"could read / couldn’t write","c":"could to read / couldn’t to write","d":"could reading / couldn’t writing"},"respuesta_correcta":"b"},{"numero":10,"pregunta":"“The phone is ringing!” “-O.K., _____ it.”","opciones":{"a":"am going answer","b":"is going to answer","c":"will answering","d":"will answer"},"respuesta_correcta":"d"},{"numero":11,"pregunta":"They broke the window, _____?","opciones":{"a":"didn’t they?","b":"did break they?","c":"didn’t they?","d":"do they?"},"respuesta_correcta":"a"},{"numero":12,"pregunta":"-Have we got _____ milk? -No, but we’ve got _____ orange juice.","opciones":{"a":"some / a","b":"a / a","c":"anything / something","d":"any / some"},"respuesta_correcta":"d"},{"numero":13,"pregunta":"I didn’t buy _____ food, but I bought _____ milk.","opciones":{"a":"many / a lot","b":"much / a few","c":"much / a lot of","d":"many / many"},"respuesta_correcta":"c"},{"numero":14,"pregunta":"Mike and Robert _____ volleyball when they lived in Los Angeles.","opciones":{"a":"used to played","b":"used to play","c":"usually plays","d":"were used play"},"respuesta_correcta":"b"},{"numero":15,"pregunta":"My house is _____ the park, _____ the supermarket and the post office.","opciones":{"a":"opposite / between","b":"opposite of / near to","c":"in front / near of","d":"in opposite of / near"},"respuesta_correcta":"a"},{"numero":16,"pregunta":"Have you heard the song _____ David wrote?","opciones":{"a":"who","b":"whose","c":"which","d":"that"},"respuesta_correcta":"d"},{"numero":17,"pregunta":"She studied very _____ for the exam, so she went to bed _____.","opciones":{"a":"hardly / lately","b":"hard / late","c":"harder / lately","d":"hardy / latte"},"respuesta_correcta":"b"},{"numero":18,"pregunta":"Rewrite this statement in reported speech: Julia said: “It will be hot tomorrow”.","opciones":{"a":"Julia said that it will being hot the next day.","b":"Julia said that it would being hot the next day.","c":"Julia said that it would be hot the next day.","d":"Julia said that it could be hot the day before."},"respuesta_correcta":"c"},{"numero":19,"pregunta":"_____ twenty applications for this job.","opciones":{"a":"There have been","b":"There have being","c":"There has been","d":"There were been"},"respuesta_correcta":"a"},{"numero":20,"pregunta":"Reading is my hobby. That’s why I have _____ books at home.","opciones":{"a":"too much","b":"too many","c":"too","d":"a lot"},"respuesta_correcta":"b"}],"reserva":[{"numero":21,"pregunta":"Choose the correct option:","opciones":{"a":"I have already seeing the new stadium.","b":"I have already seed the new stadium.","c":"I already have saw the new stadium.","d":"I have already seen the new stadium."},"respuesta_correcta":null}]}]};
const ALL=DATA.examenes.flatMap(e=>e.preguntas.map(q=>({...q,fuente:e.nombre,examenId:e.id})));
const EVALUABLE=ALL.filter(q=>q.respuesta_correcta);
const RESERVA=DATA.examenes.flatMap(e=>(e.reserva||[]).map(q=>({...q,fuente:e.nombre,examenId:e.id})));
const state={mode:null,questions:[],answers:{},idx:0,timeLeft:0,timer:null,startedAt:null};
const app=document.getElementById('app');
const HISTORY_KEY='gcEnglishHistory';

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shuffle(a){return a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);}
function history(){try{return JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]')}catch(e){return[]}}
function saveHistory(entry){let h=history();h.push(entry);localStorage.setItem(HISTORY_KEY,JSON.stringify(h.slice(-50)));}

function home(){
  clearInterval(state.timer);state.timer=null;state.questions=[];state.answers={};state.idx=0;state.mode=null;
  app.innerHTML=`
  <main>
    <section class="card">
      <div class="lead">Guardia Civil · Inglés</div>
      <h2>Simulador de examen</h2>
      <p><b>Simulación oficial</b>: 20 preguntas · 15:00 · +1 correcta · −0,33 incorrecta · 0 en blanco · APTO desde 8 puntos.</p>
      <button onclick="start('official',20)">Empezar simulación</button>
    </section>

    <section class="card">
      <div class="lead">Entrenamiento</div>
      <h2>Intensivo</h2>
      <p>Entrena con 40, 60 o 100 preguntas del banco evaluable, con tiempo proporcional al examen oficial.</p>
      <div class="row">
        <button onclick="start('intensive',40)">40 preguntas · 30 min</button>
        <button onclick="start('intensive',60)">60 preguntas · 45 min</button>
        <button onclick="start('intensive',100)">100 preguntas · 75 min</button>
      </div>
    </section>

    <section class="card">
      <div class="lead">Histórico</div>
      <h2>Modelo histórico</h2>
      <p>Elige un modelo completo de 20 preguntas, manteniendo el orden original y las opciones del glosario.</p>
      <select id="examSel">
        ${DATA.examenes.filter(e=>e.preguntas.every(q=>q.respuesta_correcta)).sort((a,b)=>{
          const ya=+(a.nombre.match(/\d{4}/)||[0])[0], yb=+(b.nombre.match(/\d{4}/)||[0])[0];
          return yb-ya||a.id-b.id;
        }).map(e=>`<option value="${e.id}">${esc(e.nombre)}</option>`).join('')}
      </select>
      <button onclick="startHistorical()">Empezar modelo</button>
    </section>

    <section class="card">
      <h2>Mis estadísticas</h2>
      <div id="statsHome"></div>
      <div class="row"><button class="secondary" onclick="showHistory()">Ver historial</button><button class="secondary" onclick="clearStats()">Borrar estadísticas</button></div>
    </section>

    <section class="card">
      <h2>Banco de preguntas</h2>
      <p><b>${ALL.length}</b> preguntas principales · <b>${EVALUABLE.length}</b> evaluables. Las 40 preguntas de 2017 que no tenían plantilla han sido corregidas y ya forman parte del banco puntuable. Además hay <b>${RESERVA.length}</b> preguntas de reserva sin clave.</p>
      <div class="notice">Las preguntas y opciones se muestran tal como aparecen en el glosario. Las preguntas en blanco no penalizan.</div>
    </section>
  </main>`;
  renderHomeStats();
}

function renderHomeStats(){
  const h=history();
  const total=h.reduce((s,x)=>s+x.total,0), correct=h.reduce((s,x)=>s+x.correct,0);
  const avg=h.length?h.reduce((s,x)=>s+x.score,0)/h.length:0;
  const apto=h.filter(x=>x.score>=x.total*.4).length;
  document.getElementById('statsHome').innerHTML=`
  <div class="stats">
    <div class="stat"><b>${h.length}</b><span>tests</span></div>
    <div class="stat"><b>${avg.toFixed(2)}</b><span>media puntos</span></div>
    <div class="stat"><b>${total?(correct/total*100).toFixed(1):'0.0'}%</b><span>acierto</span></div>
    <div class="stat"><b>${apto}</b><span>APTO</span></div>
  </div>`;
}

function start(mode,n){
  let pool=EVALUABLE.slice();
  if(mode==='official'){
    const h=history(),recent=new Set();
    h.slice(-5).forEach(t=>(t.questions||[]).forEach(q=>recent.add(q.examenId+'|'+q.numero)));
    const fresh=pool.filter(q=>!recent.has(q.examenId+'|'+q.numero));
    if(fresh.length>=n)pool=fresh;
  }
  state.questions=shuffle(pool).slice(0,n);
  begin(mode);
}

function startHistorical(){
  const id=+document.getElementById('examSel').value;
  const e=DATA.examenes.find(x=>x.id===id);
  state.questions=e.preguntas.map(q=>({...q,fuente:e.nombre,examenId:e.id}));
  begin('exam');
}

function begin(mode){
  clearInterval(state.timer);
  state.mode=mode;state.answers={};state.idx=0;state.startedAt=Date.now();
  const total=state.questions.length;
  state.timeLeft=total===20?900:total===40?1800:total===60?2700:total===100?4500:0;
  renderTest();updateTimer();
  if(state.timeLeft>0){
    state.timer=setInterval(()=>{
      state.timeLeft--;updateTimer();
      if(state.timeLeft<=0){clearInterval(state.timer);state.timer=null;finish(true);}
    },1000);
  }
}

function formatTime(t){const m=Math.floor(t/60),s=t%60;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;}
function updateTimer(){
  const el=document.getElementById('timer');if(!el)return;
  el.textContent=formatTime(state.timeLeft);
  el.className='timer'+(state.timeLeft<=60?' danger':state.timeLeft<=300?' warn':'');
}

function renderTest(){
  const q=state.questions[state.idx],total=state.questions.length;
  const answered=Object.keys(state.answers).length;
  app.innerHTML=`
  <div class="topbar"><div class="topin">
    <div><b>${state.mode==='official'?'SIMULACIÓN OFICIAL':state.mode==='exam'?'MODELO HISTÓRICO':'INTENSIVO'}</b><div class="small">${answered}/${total} respondidas</div></div>
    <div class="row">${state.timeLeft>0?'<span id="timer" class="timer">'+formatTime(state.timeLeft)+'</span>':''}<button class="danger" onclick="confirmFinish()">Finalizar</button></div>
  </div></div>
  <main>
    <div class="progress"><i style="width:${((state.idx+1)/total)*100}%"></i></div>
    <div class="qcard">
      <div class="qmeta">Pregunta ${state.idx+1} de ${total}</div>
      <div class="question">${esc(q.pregunta)}</div>
      ${['a','b','c','d'].map(k=>`
        <label class="option">
          <input type="radio" name="ans" value="${k}" ${state.answers[state.idx]===k?'checked':''} onchange="choose('${k}')">
          <span><b>${k.toUpperCase()})</b> ${esc(q.opciones[k])}</span>
        </label>`).join('')}
    </div>
    <div class="blank-note">Las preguntas en blanco no penalizan.</div>
    <div class="question-actions">
      <button class="secondary" onclick="prev()" ${state.idx===0?'disabled':''}>Anterior</button>
      <button onclick="next()">${state.idx===total-1?'Corregir':'Siguiente'}</button>
    </div>
    <div class="nav-grid">
      ${state.questions.map((_,i)=>`<button class="${state.answers[i]?'answered ':''}${i===state.idx?'current':''}" onclick="goTo(${i})">${i+1}</button>`).join('')}
    </div>
  </main>`;
  updateTimer();
}

function choose(k){state.answers[state.idx]=k;renderTest();}
function goTo(i){state.idx=i;renderTest();}
function prev(){if(state.idx>0){state.idx--;renderTest();}}
function next(){if(state.idx<state.questions.length-1){state.idx++;renderTest();}else finish(false);}
function confirmFinish(){if(confirm('¿Terminar el test y corregirlo ahora?'))finish(false);}

function finish(autoSubmitted){
  if(!state.questions.length)return;
  clearInterval(state.timer);state.timer=null;
  const total=state.questions.length;
  let correct=0,wrong=0,blank=0;
  state.questions.forEach((q,i)=>{
    const a=state.answers[i];
    if(!a)blank++;
    else if(a===q.respuesta_correcta)correct++;
    else wrong++;
  });
  const penalty=wrong*.33,score=correct-penalty;
  const elapsed=autoSubmitted?Math.round((Date.now()-state.startedAt)/1000):Math.round((Date.now()-state.startedAt)/1000);
  const entry={
    date:new Date().toISOString(),
    mode:state.mode,total,correct,wrong,blank,score,penalty,elapsed,
    label:state.mode==='official'?'Simulación oficial':state.mode==='exam'?'Modelo histórico':'Intensivo',
    questions:state.questions,answers:state.answers
  };
  saveHistory(entry);
  renderResult(entry);
}

function renderResult(r){
  const pass=r.score>=r.total*.4;
  const threshold=(r.total*.4).toFixed(0);
  app.innerHTML=`
  <main>
    <div class="result">
      <div class="small">${esc(r.label)}</div>
      <h2 class="${pass?'apt':'noapt'}">${pass?'APTO':'NO APTO'}</h2>
      <div class="stats">
        <div class="stat"><b>${r.correct}</b><span>correctas</span></div>
        <div class="stat"><b>${r.wrong}</b><span>incorrectas</span></div>
        <div class="stat"><b>${r.blank}</b><span>en blanco</span></div>
        <div class="stat"><b>${r.score.toFixed(2)}</b><span>puntuación</span></div>
      </div>
      <p><b>Fórmula:</b> ${r.correct} − (${r.wrong} × 0,33) = <b>${r.score.toFixed(2)}</b>. Penalización: ${r.penalty.toFixed(2)}.</p>
      <p><b>Porcentaje de acierto:</b> ${(r.correct/r.total*100).toFixed(1)}% · <b>Tiempo:</b> ${Math.floor(r.elapsed/60)}:${String(r.elapsed%60).padStart(2,'0')}</p>
      <p><b>APTO desde:</b> ${threshold} puntos sobre ${r.total}.</p>
      <div class="row"><button onclick="home()">Volver al inicio</button><button class="secondary" onclick="reviewAll(r)">Ver revisión</button></div>
    </div>
    <div id="review" class="review"></div>
  </main>`;
}

function reviewAll(r){
  const box=document.getElementById('review');
  const items=r.questions.map((q,i)=>({q,i,a:r.answers[i],ok:r.answers[i]===q.respuesta_correcta}));
  items.sort((x,y)=>(x.ok?1:0)-(y.ok?1:0) || x.i-y.i);
  box.innerHTML=`
    <div class="review-title"><h3>Revisión</h3><div class="review-sub">Primero tus fallos y después el resto de preguntas.</div></div>
    ${items.map(({q,i,a,ok})=>{
      const cls=!a?'blank':ok?'ok':'bad';
      return `<div class="item ${cls}">
        <div class="qmeta">Pregunta ${i+1} de ${r.total}</div>
        <b>${esc(q.pregunta)}</b>
        <div style="margin-top:8px">Tu respuesta:
          <span class="${!a?'':ok?'correct':'wrong'}"><b>${a?esc(a.toUpperCase()+' — '+q.opciones[a]):'En blanco'}</b></span>
        </div>
        <div>Respuesta correcta: <span class="correct"><b>${esc(q.respuesta_correcta.toUpperCase()+' — '+q.opciones[q.respuesta_correcta])}</b></span></div>
      </div>`;
    }).join('')}`;
}

function showHistory(){
  const h=history();
  app.innerHTML=`<main><section class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Mis estadísticas</h2><button class="secondary" onclick="home()">Volver</button></div>
  ${h.length?'<p class="small">Pulsa cualquier intento para volver a abrirlo y revisar tus respuestas y errores.</p>'+h.map((x,i)=>{
    const pass=x.score>=x.total*.4;
    const d=new Date(x.date);
    return `<div class="history-row" onclick="reviewSaved(${i})">
      <div><b>${esc(x.label)}</b><div class="small">${d.toLocaleDateString('es-ES')} · ${d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}</div></div>
      <div class="history-score ${pass?'pass':'fail'}">${x.score.toFixed(2)} · ${pass?'APTO':'NO APTO'}</div>
    </div>`;
  }).reverse().join(''):'<p>No hay tests guardados todavía.</p>'}
  </section></main>`;
}

function reviewSaved(index){
  const h=history(),r=h[index];if(!r)return;
  state.questions=r.questions||[];state.answers=r.answers||{};state.mode=r.mode;
  renderResult(r);reviewAll(r);
}

function clearStats(){
  if(confirm('¿Borrar todas las estadísticas guardadas en este navegador?')){
    localStorage.removeItem(HISTORY_KEY);
    localStorage.removeItem('gcEnglishStats');
    home();
  }
}

home();
</script>
</body>
</html>
