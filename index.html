<style>

*{box-sizing:border-box}

.notice{background:var(--green3);border-left:4px solid var(--green);padding:10px 12px;border-radius:8px;margin-top:10px;font-size:13px}

.question-actions{display:flex;justify-content:space-between;gap:8px;margin-top:12px}

const GENERADAS=(DATA.generadas||[]).map(q=>({...q,tipo:'generada'}));

const RESERVA=DATA.examenes.flatMap(e=>(e.reserva||[]).map(q=>({...q,fuente:e.nombre,examenId:e.id,tipo:'reserva'})));
const state={mode:null,questions:[],answers:{},idx:0,timeLeft:0,timer:null,startedAt:null,difficulty:'Media'};
const HISTORY_KEY='gcEnglishHistory';
const FAILURES_KEY='gcEnglishFailures';
function esc(x){return String(x??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function shuffle(a){return a.map(v=>({v,r:Math.random()})).sort((x,y)=>x.r-y.r).map(x=>x.v);}
function history(){try{return JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]')}catch(e){return[]}}
function failureBank(){try{return JSON.parse(localStorage.getItem(FAILURES_KEY)||'[]')}catch(e){return[]}}
function qKey(q){
  return q.id || ('q_'+btoa(unescape(encodeURIComponent((q.pregunta||'')+'|'+JSON.stringify(q.opciones||{})))).replace(/[^a-zA-Z0-9]/g,'').slice(0,80));
}
function rememberTrainingFailures(questions,answers){
  const bank=failureBank(), seen=new Set(bank.map(q=>qKey(q)));
  questions.forEach((q,i)=>{
    const a=answers[i];
    if(a!==q.respuesta_correcta){
      const k=qKey(q);
      if(!seen.has(k)){bank.push({...q,_failureAddedAt:new Date().toISOString()});seen.add(k);}
    }
  });
  localStorage.setItem(FAILURES_KEY,JSON.stringify(bank));
  if(currentUser)syncFailuresCloud();
}
function resolveFailureTest(questions,answers){
  const correctKeys=new Set();
  questions.forEach((q,i)=>{if(answers[i]===q.respuesta_correcta)correctKeys.add(qKey(q));});
  if(!correctKeys.size)return;
  const remaining=failureBank().filter(q=>!correctKeys.has(qKey(q)));
  localStorage.setItem(FAILURES_KEY,JSON.stringify(remaining));
  if(currentUser)syncFailuresCloud();
}
function saveHistory(x){const h=history();h.push(x);while(h.length>50)h.shift();localStorage.setItem(HISTORY_KEY,JSON.stringify(h));}

function closeAuth(){const m=document.getElementById('authModal');if(m)m.remove();}
function authMessage(text,error=false){const el=document.getElementById('authMsg');if(!el)return;el.textContent=text;el.className='auth-msg'+(error?' error':'');el.style.display='block';}
async function submitAuth(kind){
 const email=(document.getElementById('authEmail')?.value||'').trim(),password=document.getElementById('authPassword')?.value||'';
 if(!email||!password){authMessage('Introduce email y contraseña.',true);return;}
 if(password.length<6){authMessage('La contraseña debe tener al menos 6 caracteres.',true);return;}
 authMessage(kind==='login'?'Entrando...':'Creando cuenta...');
 let result;
 if(kind==='login') result=await supabaseClient.auth.signInWithPassword({email,password});
 else result=await supabaseClient.auth.signUp({email,password,options:{emailRedirectTo:SITE_URL}});
 if(result.error){authMessage(result.error.message,true);return;}
 if(kind==='signup'){
   if(result.data.session){closeAuth();await handleUser(result.data.user);}else authMessage('Cuenta creada. Revisa tu correo y pulsa el enlace de confirmación. Después vuelve a entrar aquí.');
 }else{closeAuth();await handleUser(result.data.user);}
}
function showAuth(){if(document.getElementById('authModal'))return;authModal();}

async function handleUser(user){
 currentUser=user||null;
 if(!currentUser)return;
 await ensureProfile();
 await loadCloudData();
 home();
}
async function ensureProfile(){
 if(!currentUser)return;
 const display=(currentUser.email||'').split('@')[0]||'Usuario';
 const {error}=await supabaseClient.from('profiles').upsert({id:currentUser.id,display_name:display},{onConflict:'id'});
 if(error)console.warn('Perfil:',error.message);
}
async function loadCloudData(){
 if(!currentUser)return;
 const [a,f]=await Promise.all([
   supabaseClient.from('attempts').select('*').eq('user_id',currentUser.id).order('date',{ascending:true}).limit(50),
   supabaseClient.from('failure_bank').select('question,question_id,added_at').eq('user_id',currentUser.id).order('added_at',{ascending:true})
 ]);
 if(a.error)console.warn('Historial:',a.error.message); else localStorage.setItem(HISTORY_KEY,JSON.stringify((a.data||[]).map(x=>({date:x.date,mode:x.mode,total:x.total,correct:x.correct,wrong:x.wrong,blank:x.blank,score:Number(x.score),penalty:Number(x.penalty),elapsed:x.elapsed,difficulty:x.difficulty||'',label:x.label,questions:x.questions||[],answers:x.answers||{}}))));
 if(f.error)console.warn('Fallos:',f.error.message); else localStorage.setItem(FAILURES_KEY,JSON.stringify((f.data||[]).map(x=>({...x.question,_failureAddedAt:x.added_at}))));
}
async function saveAttemptCloud(x){

 const {error}=await supabaseClient.from('attempts').insert(payload);
 if(error)console.warn('No se pudo guardar el intento online:',error.message);
}

app.innerHTML=`<main>${authPanel()}

function renderFailureStatus(){

  if(!el||!btn)return;
  const n=failureBank().length, remaining=Math.max(0,20-n);
  if(n>=20){
    el.innerHTML=`<b>✅ Desbloqueado:</b> tienes ${n} preguntas para repasar. El test utilizará exclusivamente este banco.`;
    btn.disabled=false;btn.textContent=`🎯 Repasar mis fallos (${n} preguntas)`;
  }else{
    el.innerHTML=`<b>${n}/20</b> preguntas acumuladas · te faltan <b>${remaining}</b> para desbloquearlo.`;
    btn.disabled=true;btn.textContent=`🔒 Faltan ${remaining} preguntas`;
  }
}
function startFailures(){
  const bank=failureBank();
  if(bank.length<20){alert(`El repaso de fallos se desbloquea al llegar a 20 preguntas distintas. Ahora tienes ${bank.length}.`);return;}

}
function clearFailures(){

function setDifficulty(level){state.difficulty=level;['easy','medium','hard'].forEach(x=>{const el=document.getElementById('lvl-'+x);if(el)el.classList.toggle('active',x===(level==='Fácil'?'easy':level==='Media'?'medium':'hard'));});const hint=document.getElementById('levelHint');if(hint)hint.textContent=level==='Fácil'?'Nivel fácil: estructuras más directas y distractores sencillos.':level==='Media'?'Nivel medio: mezcla de estructuras y distractores más exigentes.':'Nivel difícil: estructuras más complejas, contrastes gramaticales y distractores más parecidos.';}
function renderHomeStats(){const h=history(),total=h.reduce((s,x)=>s+x.total,0),correct=h.reduce((s,x)=>s+x.correct,0),avg=h.length?h.reduce((s,x)=>s+x.score,0)/h.length:0,apto=h.filter(x=>x.score>=x.total*.4).length;document.getElementById('statsHome').innerHTML=`<div class="stats"><div class="stat"><b>${h.length}</b><span>tests</span></div><div class="stat"><b>${avg.toFixed(2)}</b><span>media puntos</span></div><div class="stat"><b>${total?(correct/total*100).toFixed(1):'0.0'}%</b><span>acierto</span></div><div class="stat"><b>${apto}</b><span>APTO</span></div></div>`;}
function pickPool(mode){
  const official=()=>shuffle(OFICIALES.filter(q=>q.respuesta_correcta));
  const generatedBalanced=(n)=>{
    const valid=GENERADAS.filter(q=>q.respuesta_correcta && q.dificultad===state.difficulty);
    const byTheme={}; valid.forEach(q=>(byTheme[q.tema]??=[]).push(q));
    const themes=Object.keys(byTheme).sort(()=>Math.random()-.5),selected=[],used=new Set();
    while(selected.length<n){let added=false;for(const theme of themes){if(selected.length>=n)break;const c=byTheme[theme].filter(q=>!used.has(q.id));if(!c.length)continue;const q=c[Math.floor(Math.random()*c.length)];selected.push(q);used.add(q.id);added=true;}if(!added)break;}
    return selected;
  };
  if(mode==='official') return official();
  if(mode==='new') return generatedBalanced(stateTarget);
  if(mode==='mixed'){
    const nGen=Math.floor(stateTarget/2),nOff=stateTarget-nGen;
    return shuffle(official().slice(0,nOff).concat(generatedBalanced(nGen)));
  }
  return [];
}
let stateTarget=20;
function start(mode,n){stateTarget=n;const pool=pickPool(mode);if(pool.length<n){alert(mode==='new'?`No hay suficientes preguntas nuevas de nivel ${state.difficulty} para ${n} preguntas.`:'No hay suficientes preguntas disponibles para este tamaño.');return;}state.questions=pool.slice(0,n);begin(mode);}

  renderTest();updateTimer();

function formatTime(t){const m=Math.floor(t/60),s=t%60;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;}

function renderTest(){const q=state.questions[state.idx],total=state.questions.length,answered=Object.keys(state.answers).length;app.innerHTML=`<div class="topbar"><div class="topin"><div><b>${state.mode==='official'?'SIMULACIÓN OFICIAL':state.mode==='new'?'SOLO NUEVAS':state.mode==='mixed'?'MIXTO':state.mode==='failures'?'REPASO DE FALLOS':'MODELO HISTÓRICO'}</b><div class="small">${answered}/${total} respondidas${(state.mode==='new'||state.mode==='mixed')?' · Nivel '+esc(state.difficulty):''}</div></div><div class="row">${state.timeLeft>0?'<span id="timer" class="timer">'+formatTime(state.timeLeft)+'</span>':''}<button class="danger" onclick="confirmFinish()">Finalizar</button></div></div></div><main><div class="progress"><i style="width:${((state.idx+1)/total)*100}%"></i></div><div class="qcard"><div class="qmeta">Pregunta ${state.idx+1} de ${total} ${typeBadge(q)}</div><div class="question">${esc(q.pregunta).replace(/_____+/g, '<span class="blank-space">_____</span>')}</div>${['a','b','c','d'].map(k=>`<label class="option"><input type="radio" name="ans" value="${k}" ${state.answers[state.idx]===k?'checked':''} onchange="choose('${k}')"><span><b>${k.toUpperCase()})</b> ${esc(q.opciones[k])}</span></label>`).join('')}</div><div class="blank-note">Las preguntas en blanco no penalizan.</div><div class="question-actions"><button class="secondary" onclick="prev()" ${state.idx===0?'disabled':''}>Anterior</button><button onclick="next()">${state.idx===total-1?'Corregir':'Siguiente'}</button></div><div class="nav-grid">${state.questions.map((_,i)=>`<button class="${state.answers[i]?'answered ':''}${i===state.idx?'current':''}" onclick="goTo(${i})">${i+1}</button>`).join('')}</div></main>`;updateTimer();}
function choose(k){state.answers[state.idx]=k;renderTest();}
function goTo(i){state.idx=i;renderTest();} function prev(){if(state.idx>0){state.idx--;renderTest();}} function next(){if(state.idx<state.questions.length-1){state.idx++;renderTest();}else finish(false);} function confirmFinish(){if(confirm('¿Terminar el test y corregirlo ahora?'))finish(false);}
function finish(autoSubmitted){
  if(!state.questions.length)return;
  clearInterval(state.timer);state.timer=null;
  const total=state.questions.length;let correct=0,wrong=0,blank=0;
  state.questions.forEach((q,i)=>{const a=state.answers[i];if(!a)blank++;else if(a===q.respuesta_correcta)correct++;else wrong++;});
  const penalty=wrong*.33,score=correct-penalty,elapsed=Math.round((Date.now()-state.startedAt)/1000);
  if(state.mode==='new'||state.mode==='mixed')rememberTrainingFailures(state.questions,state.answers);
  if(state.mode==='failures')resolveFailureTest(state.questions,state.answers);
  const entry={date:new Date().toISOString(),mode:state.mode,total,correct,wrong,blank,score,penalty,elapsed,
    label:state.mode==='official'?'Simulación oficial':state.mode==='new'?'Solo nuevas':state.mode==='mixed'?'Mixto':state.mode==='failures'?'Repaso de fallos':'Modelo histórico',difficulty:state.difficulty,
    questions:state.questions,answers:state.answers};
  saveHistory(entry);

function renderResult(r){window.__lastResult=r;const pass=r.score>=r.total*.4,threshold=(r.total*.4).toFixed(0);app.innerHTML=`<main><div class="result"><div class="small">${esc(r.label)}</div><h2 class="${pass?'apt':'noapt'}">${pass?'APTO':'NO APTO'}</h2><div class="final-score ${pass?'pass':'fail'}"><div class="label">Puntuación final</div><div class="number">${r.score.toFixed(2)} <span style="font-size:18px">/ ${r.total}</span></div><div class="outcome">${pass?'APTO':'NO APTO'}</div></div><div class="stats"><div class="stat"><b>${r.correct}</b><span>correctas</span></div><div class="stat"><b>${r.wrong}</b><span>incorrectas</span></div><div class="stat"><b>${r.blank}</b><span>en blanco</span></div><div class="stat"><b>${r.score.toFixed(2)}</b><span>puntuación</span></div></div><p><b>Fórmula:</b> ${r.correct} − (${r.wrong} × 0,33) = <b>${r.score.toFixed(2)}</b>. Penalización: ${r.penalty.toFixed(2)}.</p><p><b>Porcentaje de acierto:</b> ${(r.correct/r.total*100).toFixed(1)}% · <b>Tiempo:</b> ${Math.floor(r.elapsed/60)}:${String(r.elapsed%60).padStart(2,'0')}</p><p><b>APTO desde:</b> ${threshold} puntos sobre ${r.total}.</p><div class="row result-actions"><button onclick="home()">Volver al inicio</button><button class="secondary" onclick="reviewCurrent()">🔎 Ver revisión</button></div></div><div id="review" class="review"></div></main>`;}
function explainGenerated(q,a){
const chosen=a?q.opciones[a]:'en blanco';
const correct=q.opciones[q.respuesta_correcta];
const example=q.ejemplo||'';
return `<div class="ai-box">
<div class="ai-title">🤖 Profesor IA · Te lo explico</div>
<div class="ai-section"><div class="ai-label">Tu respuesta</div><div>${a?esc(a.toUpperCase()+') '+chosen):'En blanco'}</div></div>
<div class="ai-section correct-box"><div class="ai-label">✅ Respuesta correcta</div><div><b>${esc(q.respuesta_correcta.toUpperCase()+') '+correct)}</b></div></div>
<div class="ai-section rule-box"><div class="ai-label">📚 Regla que tienes que recordar</div><div><b>${esc(q.regla||'')}</b></div><p>${esc(q.explicacion||'')}</p></div>
<div class="ai-example"><div class="ai-label">💡 Ejemplo práctico</div><div class="example-en">${esc(example)}</div><div class="small">Este ejemplo utiliza la misma estructura gramatical que la pregunta.</div></div>
</div>`;
}

function validateGeneratedBank(){
const seen=new Set();
for(const q of GENERADAS){
const vals=Object.values(q.opciones||{});
if(vals.length!==4||new Set(vals).size!==4||!q.respuesta_correcta||!q.opciones[q.respuesta_correcta])throw new Error('Banco inválido: '+q.id);
if(!q.ejemplo||!q.regla||!q.explicacion)throw new Error('Pregunta sin explicación completa: '+q.id);
const key=q.pregunta+'\n'+vals.join('\n');
if(seen.has(key))throw new Error('Pregunta duplicada: '+q.id);
seen.add(key);
if((q.tema||'').toLowerCase().includes('conditional')){
if(!q.pregunta.includes('_____'))throw new Error('Condicional sin hueco: '+q.id);
}
if(q.tema==='Past continuous + past simple'){
if((q.pregunta.match(/_____/g)||[]).length!==2)throw new Error('Pregunta de doble hueco incorrecta: '+q.id);
if(!vals.every(v=>v.includes(' / ')))throw new Error('Opciones de doble hueco incorrectas: '+q.id);
}
}
}
